name: Günlük Finviz sinyali

on:
  schedule:
    - cron: "0 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
        runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finviz-telegram-bot
    steps:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: python bot.py
      - name: Sinyal geçmişini kaydet
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Sinyal durumu $(date -u +%F)"
          git push
