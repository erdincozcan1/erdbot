name: Adres incele
on:
  workflow_dispatch:
    inputs:
      adres:
        description: "İncelenecek adres(ler) - birden fazlaysa virgülle ayır"
        required: true
permissions:
  contents: write
concurrency:
  group: hl-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: İncele
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADRES: ${{ github.event.inputs.adres }}
        run: python hl_inspect.py
      # Sonuçlar ayrı bir "inceleme" dalına yazılır; bot bundan etkilenmez.
      - name: Sonucu ayrı dala kaydet
        run: |
          mkdir -p /tmp/out && cp inceleme/* /tmp/out/
          git config user.name "hl-watch-bot"
          git config user.email "hl-watch-bot@users.noreply.github.com"
          if git fetch -q origin inceleme; then
            git checkout -q -B inceleme FETCH_HEAD
          else
            git checkout -q --orphan inceleme
            git rm -rfq --cached .
          fi
          cp /tmp/out/* .
          for f in /tmp/out/*; do git add "$(basename "$f")"; done
          git commit -qm "inceleme $(date -u +%F_%H%M)" || true
          git push -q origin inceleme
