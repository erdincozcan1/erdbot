name: Hyperliquid trader takibi

on:
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hl-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılık
        run: pip install requests

      # Aday veritabanı (hl_db.json) depoya yazılmaz; çalışmalar arasında GitHub önbelleğinde saklanır
      - name: Aday veritabanını yükle
        uses: actions/cache/restore@v4
        with:
          path: hl_db.json
          key: hl-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hl-db-

      - name: Takip et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hl_watcher.py

      - name: Aday veritabanını sakla
        if: always() && hashFiles('hl_db.json') != ''
        uses: actions/cache/save@v4
        with:
          path: hl_db.json
          key: hl-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "hl-watch-bot"
          git config user.email "hl-watch-bot@users.noreply.github.com"
          git add hl_state.json
          if ! git diff --cached --quiet; then
            git commit -m "hl durum $(date -u +%F_%H%M)"
            git pull --rebase
            git push
          fi
