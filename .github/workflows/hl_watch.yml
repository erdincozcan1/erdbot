name: Hyperliquid trader takibi

on:
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hl-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılık
        run: pip install requests

      - name: Takip et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hl_watcher.py

      - name: Durumu kaydet
        run: |
          git config user.name "hl-watch-bot"
          git config user.email "hl-watch-bot@users.noreply.github.com"
          git add hl_state.json
          if ! git diff --cached --quiet; then
            git commit -m "hl durum $(date -u +%F_%H%M)"
            git pull --rebase
            git push
          fi
